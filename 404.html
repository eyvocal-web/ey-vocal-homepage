<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>페이지를 찾을 수 없어요 | EY보컬스튜디오</title>
  <link rel="stylesheet" href="/css/app.min.css"/>
  <link rel="icon" href="/assets/brand/logo-icon-black.png" type="image/png"/>
  <style>
    .error-page { min-height: 100vh; min-height: 100svh; display: grid; align-content: center; justify-items: start; }
    .error-page__inner { width: min(100% - 40px, 36rem); margin-inline: auto; padding-block: 40px; }
    .error-page img { width: 110px; height: auto; margin-bottom: 42px; }
    .error-page__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-page__inner">
      <a href="/" aria-label="EY보컬스튜디오 홈"><img width="320" height="83" src="/assets/brand/logo-horizontal-black-320.webp" alt="EY보컬스튜디오"/></a>
      <p class="section__label">404</p>
      <h1 class="section__title">페이지를 찾을 수 없어요</h1>
      <p class="section__subtitle">주소가 바뀌었거나 잘못 입력되었어요. 홈에서 수업을 살펴보거나 예약·문의로 바로 이동하세요.</p>
      <nav class="error-page__actions" aria-label="다음으로 이동">
        <a href="/" class="btn btn--primary">홈으로 돌아가기</a>
        <a href="/#booking" class="btn btn--secondary">예약·문의</a>
      </nav>
    </div>
  </main>
  <script src="/js/app.min.js" defer></script>
</body>
</html>
